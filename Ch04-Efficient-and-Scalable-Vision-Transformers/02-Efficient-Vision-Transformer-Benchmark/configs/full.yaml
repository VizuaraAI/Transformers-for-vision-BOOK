name: full
tutorial_only: false
description: Complete chapter benchmark used for reportable results.
pretrained: true
data:
  root: data
  split_seed: 2027
  train_per_class: 450
  val_per_class: 50
  test_limit: null
  input_size: 224
  num_workers: 8
training:
  epochs: 20
  batch_size: 64
  backbone_lr: 0.00005
  head_lr: 0.0005
  weight_decay: 0.05
  warmup_epochs: 2
  min_lr: 0.000001
  label_smoothing: 0.1
  gradient_clip: 1.0
  amp: true
  random_erasing: 0.25
benchmark:
  precisions: [fp32, fp16]
  batch_sizes: [1, 64]
  warmup_iterations: 50
  timed_iterations: 200
  repeats: 5
runs:
  - model: convnext
    mode: standard
    seeds: [42]
  - model: vit
    mode: standard
    seeds: [42]
  - model: swin
    mode: standard
    seeds: [42]
  - model: efficientformer
    mode: standard
    seeds: [42]
  - model: deit
    mode: standard
    seeds: [42, 43, 44]
  - model: deit_distilled
    mode: standard
    seeds: [42, 43, 44]
  - model: deit_distilled
    mode: hard_kd
    seeds: [42, 43, 44]

