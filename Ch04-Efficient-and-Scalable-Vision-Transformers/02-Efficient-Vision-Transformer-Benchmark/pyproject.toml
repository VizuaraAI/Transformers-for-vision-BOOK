[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vision-transformer-benchmark"
version = "0.1.0"
description = "Book-ready ViT, DeiT, Swin, and EfficientFormer benchmark on CIFAR-100"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fvcore>=0.1.5.post20221221",
  "matplotlib>=3.9,<4",
  "modal==1.5.1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pillow>=10.4",
  "pyyaml>=6.0.2",
  "timm==1.0.28",
  "torch==2.9.1",
  "torchvision==0.24.1",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "jupyterlab>=4.3,<5",
  "mypy>=1.14",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
]

[project.scripts]
vision-bench = "vision_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_bench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that instantiate real neural-network models",
  "gpu: tests that require a CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
packages = ["vision_bench"]

[[tool.mypy.overrides]]
module = ["fvcore.*", "matplotlib.*", "pandas.*", "timm.*", "torchvision.*", "yaml.*"]
ignore_missing_imports = true
